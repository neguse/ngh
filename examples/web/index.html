<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ngh_mediapipe web example</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 2rem; background: #0d1117; color: #c9d1d9; }
  /* The stage is resized to the camera's real aspect once the stream starts;
     both layers fill it so they always scale together. */
  #stage { position: relative; width: 640px; height: 480px; background: #161b22; }
  #camera, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #camera { transform: scaleX(-1); }
  #overlay { transform: scaleX(-1); }
  #status { margin-top: .75rem; font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: .4rem .9rem; margin-top: .75rem; }
  code { background: #161b22; padding: .1rem .3rem; }
</style>
</head>
<body>
<h1>ngh_mediapipe on the web</h1>
<p>Face landmarks from C, compiled to WebAssembly, bridged to
   <code>@mediapipe/tasks-vision</code>.</p>

<div id="stage">
  <video id="camera" autoplay playsinline muted></video>
  <canvas id="overlay" width="640" height="480"></canvas>
</div>
<div id="status">idle</div>
<button id="start">Start camera</button>

<script src="ngh_web.js"></script>
<script>
// The model is fetched here and handed to C as bytes, exactly like the desktop
// examples read it off disk. Point this at a local copy in production: the
// MediaPipe wasm alone is ~11.5MB and you do not want a CDN in the critical path.
const MODEL_URL =
  'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task';

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  try {
    statusEl.textContent = 'requesting camera...';
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480 },
    });
    const video = document.getElementById('camera');
    video.srcObject = stream;

    // The constraints above are wishes, not promises: the camera often
    // delivers another size/aspect (1280x720 is common). Landmarks come back
    // normalized to the actual frame, so the overlay's drawing buffer must
    // match the frame and the stage must match its aspect -- otherwise the
    // points land beside the face.
    video.addEventListener('loadedmetadata', () => {
      const w = video.videoWidth, h = video.videoHeight;
      const overlay = document.getElementById('overlay');
      overlay.width = w;
      overlay.height = h;
      document.getElementById('stage').style.height =
        Math.round(640 * h / w) + 'px';
    }, { once: true });

    statusEl.textContent = 'fetching model...';
    const bytes = new Uint8Array(await (await fetch(MODEL_URL)).arrayBuffer());

    // Copy the model into wasm memory and pass the pointer to C.
    const ptr = Module._malloc(bytes.length);
    Module.HEAPU8.set(bytes, ptr);
    const rc = Module.ccall('ngh_web_start', 'number',
                            ['number', 'number'], [ptr, bytes.length]);
    Module._free(ptr);
    if (rc !== 0) statusEl.textContent = 'start failed';
  } catch (err) {
    statusEl.textContent = String(err);
    startBtn.disabled = false;
  }
});
</script>
</body>
</html>
